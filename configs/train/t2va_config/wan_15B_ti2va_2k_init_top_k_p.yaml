
training_config:

  pretrained_model_name_or_path: /path/Prism/checkpoints/pretrained_models/pretrained_models/MOVA-360p
  master_weight_type: bf16

  # loss weight
  video_loss_weight: 0.75
  audio_loss_weight: 0.25

  # dual-tower noise schedule shift
  visual_shift: 9.0
  audio_shift: 5.0

dataloader_config:
  # Bucketed manifest produced by tools/build_dataset_csv.py.
  video_csv_file:
  - /path/final_2k_limited.csv
  video_size:
  - 1920
  - 1920
  sample_stride: 1
  sample_n_frames: 265
  video_fps: 24
  num_workers: 4
  prefetch_factor: 2
  video_micro_batch_size: 1
  text_len: 512
  is_image: false
  video_multireso: true
  video_multitemp: true
  # false = use each cached latent whole (identical to the old Arrow loader) and
  # key the bucket on its exact length. Set true only when raising
  # video_micro_batch_size: it trims up to (temporal_interval - 1) frames so the
  # temporal buckets are coarse enough to fill a multi-sample batch.
  crop_latent_to_bucket: false
  vae_spatial_ratio: 8
  latent_resolution: "2k"
  video_uncond_p: 0.1
  audio_uncond_p: 0.2
  video_caption_sample_ratio: '{"style_features":0.0,"content_summary":0.0,"background_audio":1.0,"static_description":1.0,"dynamic_description":1.0,"time_range":0.0}'
  video_caption_processor: caption_process_v1
  video_num_replace_rate: 0
  video_caption_rate: 0.0
  ocr_only_long_caption: False
  text_remove_rate: 0.0
  video_bucket_hw_base_size: 1920
  video_bucket_hw_bucket_stride: 16
  video_bucket_temporal_min_length: 49
  video_bucket_temporal_max_length: 265
  video_bucket_temporal_interval: 12
  skip_sources: []
  audio_dim: 64
  audio_sr: 48000
  use_audio_vae_cache: False
  audio_wave_suffix: .m4a
  audio_frame_rate: 50
